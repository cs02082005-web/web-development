<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather + Movie App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>🌦 Weather + 🎬 Movie Search App</h1>

  <!-- WEATHER APP -->
  <div class="card">
    <h2>Weather App</h2>
    <input type="text" id="city" placeholder="Enter city name (e.g. Berhampur)" />
    <button onclick="getWeather()">Search Weather</button>

    <div id="weatherResult"></div>
  </div>

  <!-- MOVIE APP -->
  <div class="card">
    <h2>Movie Search App</h2>
    <input type="text" id="movie" placeholder="Enter movie name" />
    <button onclick="getMovie()">Search Movie</button>

    <div id="movieResult"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
