<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    //    ++  INCREMENT/INCREASE VALUE BY 1 
    //    --  DECREMENT/DECREASE VALUE BY 1

    // Task - print number 1 to 10 in your console
    // console.log(1)
    // console.log(2)
    // console.log(3)
    // .....

    // 1.FOR LOOP
    // syntax:for(start point; ending/condition point ; ++ or --){

    // }  

    // task print number 1 to 10 using for loop

    for(let i = 1; i<=10; i++){
        // body - task
        console.log("the value is:",i)
    }

    // print : print number 10 to 1
    for (let y = 10; y>=1; y--){
        console.log("reversed order",y)
    }

    // 2.WHILE LOOP - entry controlled loop
    // syntax - while(condition){

    // }
    // when condition is true while loop will start , when it becomes false it stooped
    let count = 1

    while(count<=5){
        console.log("hello world")
        count++
    }

    // 3. DO WHILE LOOP - exit controlled loop
    // it will run/execute your code atleast for one time , even if your condition is false
    
    let number = 7
    do {
        console.log("hii i am do while loop")
    }while(number<8)



    
    </script>
</body>
</html>
