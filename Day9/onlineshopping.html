<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f8f8;
            margin:0;
        }

        .parent{
            display:grid;
            grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
            gap:30px;
        }

        .product{
            border:1px solid  black;
            overflow:hidden;
            text-align: center;
            border-radius: 12px;
            box-shadow:0 2px 4px black; 

        }

        .product img{
            border-radius: 12px;
            object-fit: cover;
            height:200px;
            width: 100%;

        }

       
    </style>


</head>
<body>
    <div class="parent">
        <div class="product">
            <img src="https://images.unsplash.com/photo-1616410011236-7a42121dd981?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8aXBob25lfGVufDB8fDB8fHww">
            <h2>Iphone</h2>
            <p>$500</p>
            <button>add to cart</button>
        </div>



        <div class="parent">
          <div class="product">
            <img src="https://images.unsplash.com/photo-1630851278830-c0c9b12933ee?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTR8fGNyaWNrZXQlMjBiYXR8ZW58MHx8MHx8fDA%3D">
            <h2>cricket bat</h2>
            <p>$100</p>
            <button>add to cart</button>
        </div>


        <div class="parent">
          <div class="product">
            <img src="https://plus.unsplash.com/premium_photo-1678099940967-73fe30680949?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8aGVhZHBob25lc3xlbnwwfHwwfHx8MA%3D%3D">
            <h2>headphone</h2>
            <p>$50</p>
            <button>add to cart</button>
        </div>




        <div class="parent">
           <div class="product">
            <img src="https://images.unsplash.com/photo-1664737876792-b3e0ca631388?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTV8fGJhZ3BhY2tzfGVufDB8fDB8fHww">
            <h2>bags</h2>
            <p>$25</p>
            <button>add to cart</button>
        </div>



        <div class="parent">
          <div class="product">
            <img src="https://images.unsplash.com/photo-1622434641406-a158123450f9?q=80&w=704&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
            <h2>watch</h2>
            <p>$200</p>
            <button>add to cart</button>
        </div>

         <div class="parent">
           <div class="product">
            <img src="https://images.unsplash.com/photo-1539185441755-769473a23570?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTl8fHNob2VzfGVufDB8fDB8fHww">
            <h2>shoes</h2>
            <p>$50</p>
            <button>add to cart</button>
        </div>



    </div>
    
</body>
</html>
