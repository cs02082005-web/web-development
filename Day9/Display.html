<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        p{
            color:red;
            font-family: cursive;

        }
        p.ex1{
            display:none;
        }

        p.ex2{
            display:block;
            background-color: gray;
          }

        p.ex3{
            display: inline;
            background-color: green;

        }

        p.ex4{
            display: inline-block;
            background-color: blue;
        }
    </style>
</head>
<body>
    <h1>Display prop</h1>

    <h1>Display : None</h1>

    <div>
        here the Display none means nothing to display
        <p class="ex1"> hello display none</p>
    </div>

    <h1>Display : block</h1>

    <div>
        here the Display like a Div - 100% width of space
        <p class="ex4"> hello display none</p>
    </div>

        <h1>Display : Inline</h1>

    <div>
        here the Display like spam - required amount of width
        <p class="ex2"> hello display none</p>
    </div>

</body>
</html>
