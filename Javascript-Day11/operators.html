    <script>
    //1. Arithimetic Operator = + , - , / , * , %

    var a = 10
    var b = 7

    console.log(a+b)
    console.log(a-b)
    console.log(a/b)
    console.log(a*b)
    console.log(a%b)

    console.log(10%2)
    console.log(1%5)

    // 2. Assignment - to assign value "="

    var x = 10

    // Assign and operations

    console.log(x = x+5)
    
    console.log(x+=3)

    console.log(x-=5)

    // 3.comparison operator

    var p = 25
    var q = 20

    console.log(p>q)
    console.log(p<q)

     var abc = 20
     var cde = 10

     console.log(abc <= cde)

     const height1 = "170"
     const height2 = 170
     
    //  == only check the value not data type
     console.log(height1 == height2)

    // === check the vlue and data type both 
     console.log(height1 === height2)


    //4. Logical operator - AND , OR , Negation
    
    // AND - && :If both condition is true then only output is true

    var ismember = true

    var totalprice = 499.99

    console.log(ismember && totalprice > 500)

    // OR -|| :only if one condition is true then output is true

    var jiohostarlogin = true

    var paidsub = false

    console.log("can watch IPL as free acess" , jiohostarlogin || paidsub)

    // Negation - ! :opposite value

    let Netflixsubscription = false

    console.log("amount paid ",Netflixsubscription)
