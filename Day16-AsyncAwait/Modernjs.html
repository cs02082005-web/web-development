<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        // Template String
        var a="sunil"
        // old Way
        console.log("my name is",a)

        // new way - ${variableName/ParameterNmae}
        console.log(`my name is ${a}`)

        // arrow function

        // old way - function

        // new way -
        
        var abc = ()=>{
            console.log("hello i am arrow")
        }
        abc()

        // setTimeout(set the timer function ,time 1 sec -1000 )

        setTimeout(()=>{
            console.log(" i will run after 3 seconds")
        },3000)
    </script>
</body>
</html>
